<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>프로젝트 네뷸라 (Project Nebula) - Neon Pop Brick Shooter</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 구글 폰트 및 폰트어썸 로드 (비주얼 강화) -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0b001f;
            overflow: hidden;
            touch-action: none;
        }
        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .comfortaa {
            font-family: 'Comfortaa', cursive;
        }
        /* 울트라 네온 글로우 스타일 */
        .neon-text-cyan {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.4);
        }
        .neon-text-pink {
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.4);
        }
        .neon-glow-btn {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6), inset 0 0 10px rgba(255, 0, 127, 0.4);
            transition: all 0.2s ease;
        }
        .neon-glow-btn:hover {
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.9), inset 0 0 15px rgba(0, 243, 255, 0.5);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white select-none relative">

    <!-- 메인 게임 컨테이너 -->
    <div id="game-container" class="relative w-full max-w-[480px] h-[100vh] sm:h-[85vh] sm:max-h-[800px] bg-[#0b001f] sm:rounded-2xl overflow-hidden border border-[#2d004b] flex flex-col items-center justify-between shadow-2xl">
        
        <!-- 게임 화면 상단 HUD (더 미니멀하고 투명하게 스타일링) -->
        <div id="hud" class="absolute top-0 left-0 right-0 p-4 flex justify-between items-center z-10 bg-gradient-to-b from-[#0b001f]/90 to-transparent pointer-events-none">
            <div class="flex flex-col">
                <span class="text-[10px] text-pink-500 font-black tracking-widest uppercase">SCORE</span>
                <span id="score-text" class="text-3xl font-black orbitron text-[#00f3ff] neon-text-cyan">0</span>
            </div>
            
            <div class="flex items-center gap-2 mr-12">
                <!-- 활성화된 버프 표시기 -->
                <div id="active-buffs" class="flex gap-1"></div>
                <!-- 생명 표시 하트 -->
                <div id="lives-container" class="flex gap-1 text-pink-500 text-lg">
                    ❤️ ❤️ ❤️
                </div>
            </div>
        </div>

        <!-- 우측 상단 인게임 제어 메뉴칸 (잠시멈춤 & 다시시작) -->
        <div class="absolute top-4 right-4 z-30 flex flex-col items-end pointer-events-auto">
            <button id="menu-trigger" class="w-10 h-10 rounded-full bg-[#2d004b]/80 border border-[#00f3ff] flex items-center justify-center text-[#00f3ff] hover:bg-[#ff007f] hover:text-white transition-all shadow-lg">
                <i class="fa-solid fa-bars text-base"></i>
            </button>
            <!-- 드롭다운 메뉴 박스 -->
            <div id="dropdown-menu" class="hidden mt-2 w-32 bg-[#0b001f]/95 border border-[#ff007f] rounded-xl p-1.5 flex flex-col gap-1 shadow-2xl z-30">
                <button id="menu-stop" class="w-full py-1.5 px-2.5 rounded-lg text-left text-xs font-bold flex items-center gap-2 hover:bg-[#ff007f]/20 transition-all text-[#00f3ff]">
                    <i id="stop-icon" class="fa-solid fa-pause"></i>
                    <span id="stop-text">STOP</span>
                </button>
                <button id="menu-restart" class="w-full py-1.5 px-2.5 rounded-lg text-left text-xs font-bold flex items-center gap-2 hover:bg-[#ff007f]/20 transition-all text-[#d6ff38]">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>TRY AGAIN</span>
                </button>
            </div>
        </div>

        <!-- 캔버스 영역 -->
        <canvas id="game-canvas" class="w-full h-full block bg-gradient-to-b from-[#080018] to-[#12002e]"></canvas>

        <!-- 시작 오버레이 화면 (팝&네온 비주얼 적용) -->
        <div id="start-screen" class="absolute inset-0 bg-[#0b001f]/95 flex flex-col items-center justify-center p-6 text-center z-20 transition-opacity duration-300">
            <!-- 멋진 타이틀 로고 -->
            <div class="mb-8 relative">
                <div class="absolute -inset-1 rounded-lg bg-gradient-to-r from-[#ff007f] via-[#00f3ff] to-[#d6ff38] opacity-75 blur-lg animate-pulse"></div>
                <div class="relative bg-[#0b001f] px-8 py-5 rounded-lg border border-[#ff007f]">
                    <h1 class="text-4xl sm:text-5xl font-black tracking-wider comfortaa text-transparent bg-clip-text bg-gradient-to-r from-[#00f3ff] via-[#ff007f] to-[#d6ff38]">
                        NEBULA
                    </h1>
                    <p class="text-xs tracking-[0.4em] text-[#d6ff38] font-bold mt-1 orbitron">POP BRICK SHOT</p>
                </div>
            </div>

            <!-- 귀여운 에일리언 애니메이션 SVG 일러스트 -->
            <div class="w-28 h-28 mb-8 flex items-center justify-center">
                <svg viewBox="0 0 100 100" class="w-full h-full animate-bounce" style="animation-duration: 2s;">
                    <!-- 외계인 제트기 돔 -->
                    <circle cx="50" cy="50" r="32" fill="rgba(0, 243, 255, 0.2)" stroke="#00f3ff" stroke-width="2.5" />
                    <!-- 에일리언 본체 -->
                    <ellipse cx="50" cy="52" rx="18" ry="15" fill="#d6ff38" />
                    <!-- 안테나 -->
                    <line x1="50" y1="37" x2="50" y2="24" stroke="#d6ff38" stroke-width="4.5" stroke-linecap="round" />
                    <circle cx="50" cy="20" r="6" fill="#ff007f" />
                    <!-- 큰 귀여운 하나의 눈 -->
                    <circle cx="50" cy="48" r="9" fill="#ffffff" />
                    <circle cx="50" cy="48" r="4.5" fill="#0b001f" />
                    <circle cx="48" cy="46" r="1.8" fill="#ffffff" />
                    <!-- 미소 -->
                    <path d="M 45 58 Q 50 63 55 58" stroke="#0b001f" stroke-width="2.5" fill="none" stroke-linecap="round" />
                    <!-- 좌우 네온 엔진 날개 -->
                    <path d="M 15 62 L 32 62 L 28 45 Z" fill="#ff007f" />
                    <path d="M 85 62 L 68 62 L 72 45 Z" fill="#ff007f" />
                </svg>
            </div>

            <!-- 게임 기능 일러스트 & 가이드 -->
            <div class="max-w-[300px] bg-[#2d004b]/40 border border-[#00f3ff]/40 p-4 rounded-xl mb-8 text-left text-sm text-purple-200 space-y-2.5">
                <div class="flex items-center gap-3">
                    <span class="text-[#00f3ff] text-base"><i class="fa-solid fa-gamepad"></i></span>
                    <span>마우스/터치 드래그 & 좌우 키보드로 이동</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-[#ff007f] text-base"><i class="fa-solid fa-bolt"></i></span>
                    <span>자동 연사 방식으로 벽돌 파괴!</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-[#d6ff38] text-base"><i class="fa-solid fa-gauge-high"></i></span>
                    <span>점수가 오르면 낙하 속도 무한 증가!</span>
                </div>
            </div>

            <!-- 연사 스타트 버튼 (간결한 영문 START 기용) -->
            <button id="start-btn" class="px-12 py-4 bg-gradient-to-r from-[#ff007f] to-[#b500ff] rounded-full font-black text-xl tracking-[0.2em] text-white neon-glow-btn orbitron">
                START
            </button>
        </div>

        <!-- 게임 오버 오버레이 화면 -->
        <div id="game-over-screen" class="absolute inset-0 bg-[#0b001f]/95 flex flex-col items-center justify-center p-6 text-center z-20 hidden transition-opacity duration-300">
            <h2 class="text-5xl font-black text-[#ff007f] comfortaa tracking-wider mb-2 neon-text-pink">GAME OVER</h2>
            <p class="text-purple-300 mb-8">외계인 전사가 성운 너머로 튕겨 나갔습니다!</p>

            <div class="bg-[#2d004b]/60 p-6 rounded-2xl border border-[#ff007f]/50 max-w-[280px] w-full mb-8">
                <div class="mb-4">
                    <p class="text-xs text-purple-400 font-bold uppercase tracking-widest">FINAL SCORE</p>
                    <p id="final-score" class="text-4xl font-black text-[#00f3ff] orbitron mt-1">0</p>
                </div>
                <div>
                    <p class="text-xs text-purple-400 font-bold uppercase tracking-widest">BEST SCORE</p>
                    <p id="high-score" class="text-2xl font-bold text-[#d6ff38] orbitron mt-1">0</p>
                </div>
            </div>

            <button id="restart-btn" class="px-10 py-3.5 bg-gradient-to-r from-[#00f3ff] to-[#4f46e5] rounded-full font-black text-lg tracking-[0.1em] hover:scale-105 active:scale-95 transition-all">
                PLAY AGAIN
            </button>
        </div>

        <!-- 하단 조작 안내 -->
        <div class="absolute bottom-2 left-0 right-0 text-center pointer-events-none z-10 opacity-30">
            <span class="text-[9px] tracking-[0.2em] text-purple-400 orbitron">NEON POP GAMEPLAY ACTIVE</span>
        </div>

    </div>

    <script>
        // Web Audio API 기반 오디오 합성기 생성 (팝 사운드 튜닝)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'laser') {
                    // 경쾌한 네온 레이저 슈팅 사운드
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(950, now);
                    osc.frequency.exponentialRampToValueAtTime(180, now + 0.12);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'hit') {
                    // 통통 튀는 피격음
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'explosion') {
                    // 시원한 벽돌 완파 사운드
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(10, now + 0.25);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'powerup') {
                    // 아케이드 감성의 파워업 습득 멜로디
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.setValueAtTime(520, now + 0.08);
                    osc.frequency.setValueAtTime(780, now + 0.16);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'gameover') {
                    // 레트로풍 슬픈 디스코드 멜로디
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.6);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'damage') {
                    // 플레이어 피격 경고음
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.warn('Audio play failed:', e);
            }
        }

        // --- 캔버스 설정 ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // 모바일 해상도 고려 가상 그리드
        const GAME_WIDTH = 480;
        const GAME_HEIGHT = 800;

        // 게임 변수
        let score = 0;
        let highScore = parseInt(localStorage.getItem('space_alien_high_score') || '0');
        let lives = 3;
        let isPlaying = false;
        let isPaused = false; // 일시정지 상태 추적 플래그
        let bricks = [];
        let bullets = [];
        let particles = [];
        let powerups = [];
        let keys = {};

        // 배경 타이머 및 루프 타임
        let lastTime = 0;
        let autoFireTimer = 0;
        let brickSpawnTimer = 0;
        let nebulaPhase = 0; // 흘러가는 성운 모션 위상

        // 난이도 구성
        let brickSpeedMultiplier = 1.0;
        let baseBrickSpeed = 1.4; // 조금 더 스피디한 초기 속도

        // 플레이어 (기존 대비 확대 적용 1.16배 + 볼륨감 보강)
        const player = {
            x: GAME_WIDTH / 2,
            y: GAME_HEIGHT - 85,
            width: 58,
            height: 58,
            targetX: GAME_WIDTH / 2,
            speed: 9,
            // 버프 타임라인
            tripleShotTimer: 0,
            shieldTimer: 0,
            slowTimeTimer: 0
        };

        // 1. 벽돌 클래스 (대폭 두꺼워진 팝 네온 스타일 구현)
        class Brick {
            constructor() {
                // 더 폭넓고 묵직한 벽돌 크기
                this.width = 65 + Math.random() * 25;
                this.height = 36; // 두께를 25px -> 36px로 확 올려 묵직해진 두께!
                this.x = Math.random() * (GAME_WIDTH - this.width);
                this.y = -this.height;
                
                // 통통 튀는 발랄한 세 가지 컬러 선정
                const rand = Math.random();
                if (rand > 0.8) {
                    this.maxHp = 3;
                    this.color = '#ff007f'; // 네온 핫 핑크
                } else if (rand > 0.5) {
                    this.maxHp = 2;
                    this.color = '#00f3ff'; // 네온 시안
                } else {
                    this.maxHp = 1;
                    this.color = '#d6ff38'; // 네온 라임 그린
                }
                this.hp = this.maxHp;
                this.speed = baseBrickSpeed + (Math.random() * 0.4);
            }

            update(speedMod) {
                // 동적 난이도 비례 낙하
                this.y += this.speed * brickSpeedMultiplier * speedMod;
            }

            draw() {
                ctx.save();
                
                // 강렬한 네온 광선 섀도우 주입
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                
                // 두툼한 둥근 블록 형태 그리기
                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2; // 선명한 테두리선

                const radius = 8;
                ctx.beginPath();
                ctx.moveTo(this.x + radius, this.y);
                ctx.lineTo(this.x + this.width - radius, this.y);
                ctx.quadraticCurveTo(this.x + this.width, this.y, this.x + this.width, this.y + radius);
                ctx.lineTo(this.x + this.width, this.y + this.height - radius);
                ctx.quadraticCurveTo(this.x + this.width, this.y + this.height, this.x + this.width - radius, this.y + this.height);
                ctx.lineTo(this.x + radius, this.y + this.height);
                ctx.quadraticCurveTo(this.x, this.y + this.height, this.x, this.y + this.height - radius);
                ctx.lineTo(this.x, this.y + radius);
                ctx.quadraticCurveTo(this.x, this.y, this.x + radius, this.y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 3D 팝 효과 느낌의 입체 그림자 레이어 추가
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(this.x + 3, this.y + this.height - 7, this.width - 6, 4);

                // 체력에 맞추어 표기되는 정중앙 인덱스 텍스트
                if (this.hp > 1) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#0b001f';
                    ctx.font = 'black 14px Orbitron';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.hp, this.x + this.width / 2, this.y + this.height / 2);
                }

                ctx.restore();
            }
        }

        // 2. 총알 클래스 (더 정밀하고 멋진 캡슐형 플라즈마 에너지 탄환으로 제작)
        class Bullet {
            constructor(x, y, angle = 0) {
                this.x = x;
                this.y = y;
                this.length = 18;  // 발사체 볼륨 증가
                this.width = 5.5;  
                this.radius = 5.5; 
                this.speed = 12;   // 빠른 기동성
                this.angle = angle;
            }

            update() {
                this.x += Math.sin(this.angle) * this.speed;
                this.y -= Math.cos(this.angle) * this.speed;
            }

            draw() {
                ctx.save();
                
                // 레이저 진행 방향 정렬 회전
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // 플라즈마 에너지 글로우
                ctx.shadowBlur = 14;
                ctx.shadowColor = '#00f3ff';

                // 미려한 네온 그라데이션 광선 빌드
                const gradient = ctx.createLinearGradient(0, this.length / 2, 0, -this.length / 2);
                gradient.addColorStop(0, 'rgba(255, 0, 127, 0)');
                gradient.addColorStop(0.3, '#ff007f'); // 핑크 외곽
                gradient.addColorStop(0.7, '#00f3ff'); // 시안 중심 코어
                gradient.addColorStop(1, '#ffffff');    // 초고온 백색 탄두

                ctx.fillStyle = gradient;

                const w = this.width;
                const h = this.length;
                ctx.beginPath();
                ctx.moveTo(-w / 2, h / 2);
                ctx.lineTo(-w / 2, -h / 2 + w / 2);
                ctx.arcTo(-w / 2, -h / 2, 0, -h / 2, w / 2);
                ctx.arcTo(w / 2, -h / 2, w / 2, -h / 2 + w / 2, w / 2);
                ctx.lineTo(w / 2, h / 2);
                ctx.closePath();
                ctx.fill();

                // 초정밀 코어 라이트 추가
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, h / 4);
                ctx.lineTo(0, -h / 2 + 2);
                ctx.stroke();

                ctx.restore();
            }
        }

        // 3. 네온 파티클 (파괴 및 충돌 시 뿜어져 나오는 역동적인 조각 효과)
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                // 네온 스타일을 위한 다양한 형태의 기하학적 파편들 생성
                this.size = Math.random() * 4 + 1.5;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.alpha = 1;
                this.decay = Math.random() * 0.04 + 0.015;
                this.angle = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.rotationSpeed;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;

                // 단순 원형이 아닌 멋진 사각 보석 형태의 네온 입자 드로잉
                ctx.beginPath();
                ctx.rect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.fill();

                ctx.restore();
            }
        }

        // 4. 버프 아이템 일람 및 캡슐
        const PowerupTypes = {
            TRIPLE_SHOT: { color: '#00f3ff', symbol: '🌟' }, // 트리플 멀티 발사
            SHIELD: { color: '#ff007f', symbol: '🛡️' },      // 무적 보호막 오라
            SLOW: { color: '#d6ff38', symbol: '⚡' },        // 성운 속 시간 둔화
            HEAL: { color: '#ff007f', symbol: '💖' }         // 에너지 충전 (회복)
        };

        class PowerUp {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 18;
                this.speed = 2.2;
                
                const rand = Math.random();
                if (rand < 0.35) {
                    this.type = 'TRIPLE_SHOT';
                } else if (rand < 0.65) {
                    this.type = 'SLOW';
                } else if (rand < 0.85) {
                    this.type = 'SHIELD';
                } else {
                    this.type = 'HEAL';
                }
                
                this.config = PowerupTypes[this.type];
                this.pulse = 0;
            }

            update() {
                this.y += this.speed;
                this.pulse += 0.12; // 화려한 회전 흔들림
            }

            draw() {
                ctx.save();
                const scale = 1 + Math.sin(this.pulse) * 0.15;
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.config.color;
                
                // 외곽 네온 써클 링
                ctx.fillStyle = 'rgba(11, 0, 31, 0.9)';
                ctx.strokeStyle = this.config.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 이모지 심볼 기입
                ctx.fillStyle = '#ffffff';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.config.symbol, this.x, this.y);

                ctx.restore();
            }
        }

        // 5. 귀여운 에일리언 제트기 렌더링 (1.16배 스케일 업 및 비주얼 향상)
        function drawPlayer() {
            ctx.save();
            
            const px = player.x;
            const py = player.y;

            ctx.translate(px, py);
            // 요청된 크기 확대(1.16배) 적용
            ctx.scale(1.16, 1.16);

            // 실드 활성화 장막 (전용 네온 장벽)
            if (player.shieldTimer > 0) {
                ctx.save();
                ctx.shadowBlur = 24;
                ctx.shadowColor = '#ff007f';
                ctx.strokeStyle = 'rgba(255, 0, 127, 0.85)';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.arc(0, 4, 38, 0, Math.PI * 2);
                ctx.stroke();
                
                // 오라 안쪽 반짝임
                ctx.fillStyle = 'rgba(255, 0, 127, 0.05)';
                ctx.fill();
                ctx.restore();
            }

            // 제트 기류 부스터 화염 (동적 네온 연출)
            const flameHeight = 15 + Math.random() * 10;
            ctx.fillStyle = '#ff007f'; 
            ctx.beginPath();
            ctx.moveTo(-11, 25);
            ctx.lineTo(0, 25 + flameHeight);
            ctx.lineTo(11, 25);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#00f3ff'; 
            ctx.beginPath();
            ctx.moveTo(-6, 25);
            ctx.lineTo(0, 25 + flameHeight * 0.6);
            ctx.lineTo(6, 25);
            ctx.closePath();
            ctx.fill();

            // 날개 & 전투기 프레임
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#b500ff';
            ctx.fillStyle = '#4f46e5';
            ctx.beginPath();
            ctx.moveTo(0, -12);
            ctx.lineTo(-30, 22);
            ctx.lineTo(-16, 22);
            ctx.lineTo(0, 6);
            ctx.lineTo(16, 22);
            ctx.lineTo(30, 22);
            ctx.closePath();
            ctx.fill();

            // 날개끝 보조 날개 (라임 네온 데코)
            ctx.strokeStyle = '#d6ff38';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-30, 22);
            ctx.lineTo(-22, 6);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(30, 22);
            ctx.lineTo(22, 6);
            ctx.stroke();

            // 유리 돔 캡슐
            ctx.fillStyle = 'rgba(0, 243, 255, 0.28)';
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 귀여운 외눈박이 에일리언 탑승객
            const ax = 0;
            const ay = 3;

            // 얼굴 바디 (연두색)
            ctx.fillStyle = '#d6ff38';
            ctx.beginPath();
            ctx.ellipse(ax, ay, 11, 9, 0, 0, Math.PI * 2);
            ctx.fill();

            // 쫑긋 세워진 안테나와 스타 비즈
            ctx.strokeStyle = '#d6ff38';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(ax, ay - 8);
            ctx.lineTo(ax, ay - 15);
            ctx.stroke();
            ctx.fillStyle = '#ff007f';
            ctx.beginPath();
            ctx.arc(ax, ay - 15, 3.5, 0, Math.PI * 2);
            ctx.fill();

            // 외눈알 (크고 말랑말랑한 눈방울)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ax, ay - 1, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0b001f';
            ctx.beginPath();
            ctx.arc(ax, ay - 1, 2.5, 0, Math.PI * 2);
            ctx.fill();
            // 눈 반짝 하이라이트
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ax - 1, ay - 2, 1, 0, Math.PI * 2);
            ctx.fill();

            // 부끄러운 미소 입꼬리
            ctx.strokeStyle = '#0b001f';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(ax, ay + 3, 4, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();

            ctx.restore();
        }

        // 6. 일렁이는 네온 성운 및 배경 연출 (활동적인 우주 환경 구성)
        const stars = [];
        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                size: Math.random() * 2.5 + 0.5,
                speed: Math.random() * 0.8 + 0.3 // 한층 빨라진 낙하 스피드
            });
        }

        function drawBackground() {
            // 성운 가스 효과 (실시간 그라데이션 모션 흐름으로 생동감 부여)
            nebulaPhase += 0.005;
            const gradX = GAME_WIDTH / 2 + Math.sin(nebulaPhase) * 100;
            const gradY = GAME_HEIGHT / 2 + Math.cos(nebulaPhase * 1.5) * 150;
            
            const bgGrad = ctx.createRadialGradient(gradX, gradY, 20, GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_HEIGHT * 0.85);
            bgGrad.addColorStop(0, '#1a0033'); // 네온 퍼플 코어 성운
            bgGrad.addColorStop(0.5, '#07001a');
            bgGrad.addColorStop(1, '#02000a');
            
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 반짝이는 우주 먼지 성단
            ctx.fillStyle = '#00f3ff';
            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];
                ctx.globalAlpha = Math.abs(Math.sin(nebulaPhase * 3 + i)) * 0.6 + 0.4;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                star.y += star.speed;
                if (star.y > GAME_HEIGHT) {
                    star.y = 0;
                    star.x = Math.random() * GAME_WIDTH;
                }
            }
            ctx.globalAlpha = 1.0;
        }

        // --- 조작 이벤트 바인딩 ---
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function getCanvasMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const scaleX = GAME_WIDTH / rect.width;
            return (clientX - rect.left) * scaleX;
        }

        function handleMove(e) {
            if (!isPlaying) return;
            const targetX = getCanvasMousePos(e);
            player.targetX = Math.max(30, Math.min(GAME_WIDTH - 30, targetX));
        }

        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchmove', handleMove, { passive: true });

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const rect = container.getBoundingClientRect();
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            canvas.style.width = '100%';
            canvas.style.height = '100%';
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.scale(rect.width / GAME_WIDTH, rect.height / GAME_HEIGHT);
        }

        window.addEventListener('resize', resizeCanvas);
        window.onload = () => {
            resizeCanvas();
        };

        // --- 게임 초기화 및 제어 루프 ---
        function resetGame() {
            score = 0;
            lives = 3;
            bricks = [];
            bullets = [];
            particles = [];
            powerups = [];
            
            player.x = GAME_WIDTH / 2;
            player.targetX = GAME_WIDTH / 2;
            player.tripleShotTimer = 0;
            player.shieldTimer = 0;
            player.slowTimeTimer = 0;

            brickSpeedMultiplier = 1.0;
            baseBrickSpeed = 1.4;
            
            isPaused = false; // 일시정지 세트 해제
            updateStopButtonUI();
            
            updateHUD();
            
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.add('hidden');
            
            isPlaying = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function updateHUD() {
            document.getElementById('score-text').textContent = score;
            const hStr = '❤️ '.repeat(Math.max(0, lives)).trim();
            document.getElementById('lives-container').textContent = hStr || '💀';

            const buffContainer = document.getElementById('active-buffs');
            buffContainer.innerHTML = '';

            if (player.tripleShotTimer > 0) {
                buffContainer.appendChild(createBuffBadge('🌟', 'bg-cyan-500/20 text-[#00f3ff] border-cyan-500/50'));
            }
            if (player.shieldTimer > 0) {
                buffContainer.appendChild(createBuffBadge('🛡️', 'bg-pink-500/20 text-[#ff007f] border-pink-500/50'));
            }
            if (player.slowTimeTimer > 0) {
                buffContainer.appendChild(createBuffBadge('⚡', 'bg-yellow-500/20 text-[#d6ff38] border-yellow-500/50'));
            }
        }

        function createBuffBadge(symbol, classes) {
            const span = document.createElement('span');
            span.className = `text-xs px-1.5 py-0.5 rounded border flex items-center gap-0.5 animate-pulse font-black ${classes}`;
            span.innerHTML = symbol;
            return span;
        }

        function updateGame(deltaTime) {
            // 좌우 키 바인딩 이동
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.targetX = Math.max(30, player.targetX - player.speed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.targetX = Math.min(GAME_WIDTH - 30, player.targetX + player.speed);
            }

            // 부드러운 LERP 보간 이동
            player.x += (player.targetX - player.x) * 0.22;

            // 버프 시간 누적 감쇄
            if (player.tripleShotTimer > 0) player.tripleShotTimer -= deltaTime;
            if (player.shieldTimer > 0) player.shieldTimer -= deltaTime;
            if (player.slowTimeTimer > 0) player.slowTimeTimer -= deltaTime;

            const isSlowActive = player.slowTimeTimer > 0;
            const currentSpeedMod = isSlowActive ? 0.35 : 1.0;

            // 총알 무한 자동 발사 (타이머 갱신)
            autoFireTimer += deltaTime;
            if (autoFireTimer >= 160) { // 더욱 빨라진 속사감 부여
                autoFireTimer = 0;
                shootBullet();
            }

            // 벽돌 제너레이트 연산
            brickSpawnTimer += deltaTime;
            const spawnInterval = Math.max(700, 1800 - (score * 0.5));
            if (brickSpawnTimer >= spawnInterval) {
                brickSpawnTimer = 0;
                bricks.push(new Brick());
            }

            // 총알 위치 갱신 및 경계 처리
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                if (bullets[i].y < -20 || bullets[i].x < -20 || bullets[i].x > GAME_WIDTH + 20) {
                    bullets.splice(i, 1);
                }
            }

            // 벽돌 위치 갱신 및 소멸/격돌 처리
            for (let i = bricks.length - 1; i >= 0; i--) {
                const brick = bricks[i];
                brick.update(currentSpeedMod);

                // 아래 바닥으로 도달 시 기지 방벽 손상
                if (brick.y > GAME_HEIGHT) {
                    bricks.splice(i, 1);
                    triggerDamage();
                    continue;
                }

                // 기체와 벽돌의 직격 격돌 (커진 충돌 가중치 43으로 정교화)
                const pDist = Math.hypot(brick.x + brick.width / 2 - player.x, brick.y + brick.height / 2 - player.y);
                if (pDist < 43) { 
                    bricks.splice(i, 1);
                    triggerDamage();
                }
            }

            // 보너스 아이템 가속 및 섭취 판정
            for (let i = powerups.length - 1; i >= 0; i--) {
                const pUp = powerups[i];
                pUp.update();

                if (pUp.y > GAME_HEIGHT + 20) {
                    powerups.splice(i, 1);
                    continue;
                }

                const dist = Math.hypot(pUp.x - player.x, pUp.y - player.y);
                if (dist < player.width / 2 + pUp.radius) {
                    activatePowerup(pUp.type);
                    playSound('powerup');
                    
                    // 화려한 네온 입자 무리 분출
                    for (let p = 0; p < 15; p++) {
                        particles.push(new Particle(pUp.x, pUp.y, pUp.config.color));
                    }
                    powerups.splice(i, 1);
                }
            }

            // 파티클 흔적 소각
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            checkCollisions();

            // 가속 밸런싱: 점수에 따른 동적 가속도 (150점 도달할 때마다 확연하게 가속)
            brickSpeedMultiplier = 1.0 + (score / 250) * 0.15;
            
            updateHUD();
        }

        // 대미지 트리거 로직
        function triggerDamage() {
            if (player.shieldTimer > 0) {
                player.shieldTimer = 0; // 무적 배리어 파괴
                playSound('hit');
                for (let i = 0; i < 24; i++) {
                    particles.push(new Particle(player.x, player.y, '#ff007f'));
                }
                return;
            }

            lives--;
            playSound('damage');
            
            // 붉은 격돌 스파크 파편 발생
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(player.x, player.y, '#ff0055'));
            }

            if (lives <= 0) {
                gameOver();
            }
        }

        // 탄환 생성 발사 방식
        function shootBullet() {
            playSound('laser');
            if (player.tripleShotTimer > 0) {
                // 트리플 확산 샷 (3갈래 레이저)
                bullets.push(new Bullet(player.x, player.y - 15, 0));
                bullets.push(new Bullet(player.x - 12, player.y - 8, -0.25)); 
                bullets.push(new Bullet(player.x + 12, player.y - 8, 0.25));  
            } else {
                // 일반 고열 단발 레이저
                bullets.push(new Bullet(player.x, player.y - 15, 0));
            }
        }

        // 아이템 섭취 유틸
        function activatePowerup(type) {
            if (type === 'TRIPLE_SHOT') {
                player.tripleShotTimer = 8000; // 8초 동안 초강력 멀티 발사
            } else if (type === 'SHIELD') {
                player.shieldTimer = 10000; // 10초 무적 보호
            } else if (type === 'SLOW') {
                player.slowTimeTimer = 7000; // 7초 시공간 왜곡 슬로우
            } else if (type === 'HEAL') {
                lives = Math.min(3, lives + 1); // 든든하게 하트 추가
            }
        }

        // 총알 vs 두툼한 벽돌 충돌 가속 연산
        function checkCollisions() {
            for (let b = bullets.length - 1; b >= 0; b--) {
                const bullet = bullets[b];
                for (let r = bricks.length - 1; r >= 0; r--) {
                    const brick = bricks[r];

                    // 총알 레이저 반경 비례 사각형 매트릭스 침투 검사
                    if (bullet.x + bullet.radius > brick.x &&
                        bullet.x - bullet.radius < brick.x + brick.width &&
                        bullet.y + bullet.radius > brick.y &&
                        bullet.y - bullet.radius < brick.y + brick.height) {
                        
                        bullets.splice(b, 1);
                        brick.hp--;
                        
                        playSound('hit');

                        // 화려한 네온 파열 스파크 발산
                        for (let p = 0; p < 8; p++) {
                            particles.push(new Particle(bullet.x, bullet.y, brick.color));
                        }

                        // 완벽하게 벽돌 폭사 시
                        if (brick.hp <= 0) {
                            for (let p = 0; p < 20; p++) {
                                particles.push(new Particle(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.color));
                            }
                            playSound('explosion');

                            // 아이템 드롭 확률 (17%로 고정)
                            if (Math.random() < 0.17) {
                                powerups.push(new PowerUp(brick.x + brick.width / 2, brick.y + brick.height / 2));
                            }

                            score += brick.maxHp * 10;
                            bricks.splice(r, 1);
                        }
                        break; 
                    }
                }
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 가상 그라데이션 성운 + 우주 배경 
            drawBackground();

            // 두꺼워진 네온 블록 렌더링
            for (const brick of bricks) {
                brick.draw();
            }

            // 고해상도 플라즈마 탄환 렌더링
            for (const bullet of bullets) {
                bullet.draw();
            }

            // 파워업 아이템 캡슐 렌더링
            for (const pUp of powerups) {
                pUp.draw();
            }

            // 네온 기하학 파티클 잔해들 렌더링
            for (const part of particles) {
                part.draw();
            }

            // 1.16배 업그레이드 에일리언 제트기 렌더링
            drawPlayer();

            // 일시 정지 비주얼 오버레이 라이트닝
            if (isPaused) {
                ctx.save();
                ctx.fillStyle = 'rgba(11, 0, 31, 0.75)';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00f3ff';
                ctx.fillStyle = '#00f3ff';
                ctx.font = 'black 32px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('PAUSED', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 20);
                
                ctx.shadowBlur = 0;
                ctx.font = 'bold 14px Noto Sans KR';
                ctx.fillStyle = '#ffffff';
                ctx.fillText('메뉴에서 STOP을 다시 누르면 재개됩니다', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 25);
                ctx.restore();
            }
        }

        function gameLoop(currentTime) {
            if (!isPlaying) return;

            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            const clampedDelta = Math.min(deltaTime, 100);

            // STOP 상태일 경우 업데이트(이동 및 물리연산)를 완전히 일시 중지
            if (!isPaused) {
                updateGame(clampedDelta);
            }
            drawGame();

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isPlaying = false;
            isPaused = false; // 게임 오버시 정지 해제
            updateStopButtonUI();
            playSound('gameover');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('space_alien_high_score', highScore);
            }

            document.getElementById('final-score').textContent = score;
            document.getElementById('high-score').textContent = highScore;
            
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // 온클릭 버튼 이벤트 리스너 바인딩
        document.getElementById('start-btn').addEventListener('click', () => {
            resetGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            resetGame();
        });

        // 우측 상단 드롭다운 및 기능 트리거 리스너 바인딩
        const menuTrigger = document.getElementById('menu-trigger');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const menuStop = document.getElementById('menu-stop');
        const menuRestart = document.getElementById('menu-restart');
        const stopIcon = document.getElementById('stop-icon');
        const stopText = document.getElementById('stop-text');

        menuTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('hidden');
        });

        // 메뉴 외 영역 터치/클릭 시 드롭다운 닫기
        document.addEventListener('click', () => {
            dropdownMenu.classList.add('hidden');
        });

        menuStop.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isPlaying) return; // 활성 플레이 중일 때만 동작
            isPaused = !isPaused;
            updateStopButtonUI();
            dropdownMenu.classList.add('hidden');
        });

        menuRestart.addEventListener('click', (e) => {
            e.stopPropagation();
            isPaused = false;
            updateStopButtonUI();
            resetGame();
            dropdownMenu.classList.add('hidden');
        });

        function updateStopButtonUI() {
            if (isPaused) {
                stopIcon.className = 'fa-solid fa-play';
                stopText.textContent = 'RESUME';
            } else {
                stopIcon.className = 'fa-solid fa-pause';
                stopText.textContent = 'STOP';
            }
        }
    </script>
</body>
</html>
